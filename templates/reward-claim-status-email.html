<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{emailTitle}}</title>
  </head>
  <body style="margin: 0; padding: 0; background-color: #f7f7f7">
    <table
      role="presentation"
      cellpadding="0"
      cellspacing="0"
      width="100%"
      style="background-color: #f7f7f7"
    >
      <tr>
        <td align="center" style="padding: 24px 16px">
          <table
            role="presentation"
            cellpadding="0"
            cellspacing="0"
            width="100%"
            style="
              max-width: 600px;
              background-color: #ffffff;
              border-radius: 12px;
              overflow: hidden;
              border: 1px solid #e6e6e6;
            "
          >
            <!-- Header -->
            <tr>
              <td
                style="
                  padding: 24px 24px 0 24px;
                  font-family:
                    -apple-system,
                    Segoe UI,
                    Roboto,
                    Arial,
                    Helvetica,
                    sans-serif;
                  color: #111111;
                "
              >
                <table
                  role="presentation"
                  cellpadding="0"
                  cellspacing="0"
                  align="center"
                  style="margin: 0 auto 8px auto"
                >
                  <tr>
                    <td style="padding: 0 12px 0 0">
                      <img
                        src="cid:logo"
                        alt="{{appName}}"
                        style="height: 32px; width: auto; display: block"
                      />
                    </td>
                    <td style="padding: 0">
                      <h1
                        style="
                          margin: 0;
                          font-size: 22px;
                          line-height: 1.3;
                          font-weight: 700;
                        "
                      >
                        {{headerTitle}}
                      </h1>
                    </td>
                  </tr>
                </table>
                <p
                  style="
                    margin: 12px 0 0 0;
                    font-size: 14px;
                    line-height: 1.6;
                    color: #333333;
                  "
                >
                  Hola <strong>{{userName}}</strong>, {{mainMessage}}
                </p>
              </td>
            </tr>

            <!-- Reward Info Box -->
            <tr>
              <td style="padding: 24px">
                <table
                  role="presentation"
                  cellpadding="0"
                  cellspacing="0"
                  width="100%"
                  style="
                    background-color: #f9f9f9;
                    border-radius: 8px;
                    border: 1px solid #e6e6e6;
                  "
                >
                  <tr>
                    <td
                      style="
                        padding: 16px;
                        font-family:
                          -apple-system,
                          Segoe UI,
                          Roboto,
                          Arial,
                          Helvetica,
                          sans-serif;
                      "
                    >
                      <p
                        style="
                          margin: 0 0 4px 0;
                          font-size: 11px;
                          text-transform: uppercase;
                          letter-spacing: 0.5px;
                          color: #888888;
                        "
                      >
                        Premio
                      </p>
                      <p
                        style="
                          margin: 0 0 12px 0;
                          font-size: 18px;
                          font-weight: 600;
                          color: #111111;
                        "
                      >
                        {{rewardName}}
                      </p>
                      <table
                        role="presentation"
                        cellpadding="0"
                        cellspacing="0"
                        width="100%"
                        style="border-top: 1px solid #e6e6e6; padding-top: 12px"
                      >
                        <tr>
                          <td
                            style="
                              padding-top: 12px;
                              font-size: 13px;
                              color: #666666;
                            "
                          >
                            Código de seguimiento:
                          </td>
                          <td
                            align="right"
                            style="
                              padding-top: 12px;
                              font-size: 13px;
                              font-weight: 600;
                              color: #111111;
                            "
                          >
                            {{claimCode}}
                          </td>
                        </tr>
                      </table>
                    </td>
                  </tr>
                </table>
              </td>
            </tr>

            <!-- Status Info Box -->
            <tr>
              <td style="padding: 0 24px 24px 24px">{{statusInfoBox}}</td>
            </tr>

            <!-- Help Text -->
            <tr>
              <td
                style="
                  padding: 0 24px 24px 24px;
                  font-family:
                    -apple-system,
                    Segoe UI,
                    Roboto,
                    Arial,
                    Helvetica,
                    sans-serif;
                  color: #777777;
                "
              >
                <p style="margin: 0; font-size: 12px; line-height: 1.6">
                  Si tienes alguna pregunta, no dudes en contactarnos.
                </p>
              </td>
            </tr>

            <!-- Footer -->
            <tr>
              <td
                style="
                  padding: 24px;
                  font-family:
                    -apple-system,
                    Segoe UI,
                    Roboto,
                    Arial,
                    Helvetica,
                    sans-serif;
                  color: #999999;
                  text-align: center;
                  border-top: 1px solid #eaeaea;
                "
              >
                <p style="margin: 0; font-size: 11px; line-height: 1.6">
                  © {{year}} {{appName}} · Soporte:
                  <a
                    href="mailto:{{supportEmail}}"
                    style="color: #555555; text-decoration: none"
                    >{{supportEmail}}</a
                  >
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
